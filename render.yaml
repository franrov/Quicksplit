services:
  - type: web
    name: quicksplit
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/quicksplit.db
    disk:
      name: quicksplit-data
      mountPath: /var/data
      sizeGB: 1
