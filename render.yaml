services:
  - type: web
    name: quicksplit
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/quicksplit.db
    disk:
      name: quicksplit-data
      mountPath: /var/data
      sizeGB: 1
